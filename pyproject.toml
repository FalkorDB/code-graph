[project]
name = "falkordb-code-graph"
version = "0.4.2"
description = "code_graph is designed to help developers visualize and analyze the structure of their source code. It takes source code as input and generates a graph representation, making it easier to understand relationships and dependencies within the codebase."
authors = [{name = "Roi Lipman", email = "roilipman@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "graphrag-sdk>=1.1.1,<2.0.0",
    "tree-sitter>=0.25.2,<0.26.0",
    "validators>=0.35.0,<0.36.0",
    "falkordb>=1.1.3,<2.0.0",
    "tree-sitter-c>=0.24.1,<0.25.0",
    "tree-sitter-python>=0.25.0,<0.26.0",
    "tree-sitter-java>=0.23.5,<0.24.0",
    "tree-sitter-javascript>=0.23.0,<0.26.0",
    "tree-sitter-kotlin>=1.1.0,<2.0.0",
    "tree-sitter-c-sharp>=0.23.1,<0.24.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "falkordb-multilspy>=0.1.0,<1.0.0",
    "javatools>=1.6.0,<2.0.0",
    "pygit2>=1.17.0,<2.0.0",
    "typer>=0.24.0,<1.0.0",
    "mcp>=1.0.0,<2.0.0",
]

[project.scripts]
cgraph = "api.cli:app"
cgraph-mcp = "api.mcp.server:main"

[project.optional-dependencies]
test = [
    "pytest>=9.0.2,<10.0.0",
    "ruff>=0.11.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "anyio>=4.0,<5.0",
]
bench = [
    "datasets>=4.8.5",
    "mini-swe-agent>=1.0.0",
    "swebench>=4.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that spawn external subprocesses (LSP servers, FalkorDB, etc.); skip with -m 'not slow'",
]
# Keep pytest from walking into per-instance bench worktrees that contain
# their own copies of pytest source — collecting from those breaks the
# host pytest's AST rewriter.
norecursedirs = ["bench/cache", ".venv", "node_modules", "build", "dist", "*.egg-info"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"api.mcp" = ["templates/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "anyio>=4.0,<5.0",
    "pyyaml>=6.0.3",
]
