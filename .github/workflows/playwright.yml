name: Playwright Tests
on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install backend dependencies
      run: pip install -e .

    - name: Install frontend dependencies
      working-directory: ./app
      run: npm ci

    - name: Build frontend
      working-directory: ./app
      env:
        VITE_SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
      run: npm run build

    - name: Seed test data into FalkorDB
      run: python e2e/seed_test_data.py

    - name: Install Playwright
      run: |
        npm ci
        npx playwright install --with-deps

    - name: Run Playwright tests
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
      run: |
        flask --app api/index.py run --host 0.0.0.0 --port 5000 &
        # Wait for Flask to be ready
        timeout 30 bash -c 'until curl -s http://localhost:5000/ > /dev/null 2>&1; do sleep 0.5; done'
        npx playwright test --shard=${{ matrix.shard }}/2 --reporter=dot,list

    - name: Ensure required directories exist
      if: always()
      run: |
        mkdir -p playwright-report
        mkdir -p playwright-report/artifacts

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-shard-${{ matrix.shard }}
        path: playwright-report/
        retention-days: 30

    - name: Upload failed test screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: failed-test-screenshots-shard-${{ matrix.shard }}
        path: playwright-report/artifacts/
        retention-days: 30
